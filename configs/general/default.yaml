# @package _global_

name: 'template'
working_dir: ${work_dir}
random_seed: 1111

log:
  # output_dir: '${work_dir}/outputs/${name}-${now:%Y-%m-%d_%H-%M-%S}'
  output_dir: '${work_dir}/outputs/${name}'
  use_tensorboard: true
  use_wandb: false
  wandb_init_conf:
    name: ${name}
    entity: ethan-predator
    project: ${name}
  summary_interval: 10 # interval of step
  ckpt_interval: 0 # disable step checkpoints (epoch only)
  max_checkpoints: 3
  step_timing: false
  step_timing_interval: 1
  step_timing_log_all_ranks: false
  sync_cuda_before_train_loss_reduce: false
  train_loss_reduce_mode: gather_mean
  # ckpt_dir: '${work_dir}/outputs/${name}-${now:%Y-%m-%d_%H-%M-%S}/ckpts'
  ckpt_dir: '${work_dir}/outputs/${name}/ckpts'

hydra:
  run:
    # dir: ${work_dir}/outputs/${name}-${now:%Y-%m-%d_%H-%M-%S}
    dir: ${work_dir}/outputs/${name}

work_dir: ${hydra:runtime.cwd}
