# @package _global_

defaults:
  - pi3x_hand_object
  - _self_

name: pi3x_overfit

# Dataset: overfit on a single ForeHOI shard with 3 frames per sample.
train_dataset:
  _target_: datasets.forehoi_dataset.ForeHOIDataset
  data_root: ${oc.env:FOREHOI_ROOT,${oc.env:PI3_DATA_ROOT,data}/dataset/forehoi/pi3x_raw}
  object_multiview_root: ${oc.env:FOREHOI_OBJECT_MULTIVIEW_ROOT,${oc.env:PI3_DATA_ROOT,data}/dataset/forehoi/object_multiview_pyrender}
  max_sequences: 1
  include_object_multiview_payload: false
  use_crop: false
  mode: train
  z_far: 0
  frame_num: 3
  fix_epoch_seed: true
  resolution:
    - [224, 224]

# Ignored when test.use_train_loader=true; kept mirrored for readability.
test_dataset:
  _target_: datasets.forehoi_dataset.ForeHOIDataset
  data_root: ${oc.env:FOREHOI_ROOT,${oc.env:PI3_DATA_ROOT,data}/dataset/forehoi/pi3x_raw}
  object_multiview_root: ${oc.env:FOREHOI_OBJECT_MULTIVIEW_ROOT,${oc.env:PI3_DATA_ROOT,data}/dataset/forehoi/object_multiview_pyrender}
  max_sequences: 1
  include_object_multiview_payload: false
  use_crop: false
  mode: train
  z_far: 0
  frame_num: 3
  fix_epoch_seed: true
  resolution:
    - [224, 224]

# Hand encoder paths
hand_encoder:
  config_file: ${oc.env:HAMER_CONFIG_FILE,configs/hamer/model_config.yaml}
  checkpoint: ${oc.env:HAMER_ENCODER_CKPT,null}
  cache_dir: ${oc.env:HAMER_CACHE_DIR,${oc.env:PI3_DATA_ROOT,data}/model/hamer/_DATA}

# Model paths
model:
  ckpt: ${oc.env:PI3X_CKPT,null}
  encoder_pretrained: true
  hamer_config_file: ${oc.env:HAMER_CONFIG_FILE,configs/hamer/model_config.yaml}
  hamer_cache_dir: ${oc.env:HAMER_CACHE_DIR,${oc.env:PI3_DATA_ROOT,data}/model/hamer/_DATA}

# Training parameters for overfitting
train:
  image_num_range: [6, 6]
  max_img_per_gpu: 6
  num_epoch: 10
  iters_per_epoch: 100
  batch_size: 1
  num_workers: 0
  print_freq: 10
  auto_resume: false
  resume: null
  optimizer:
    lr: 5e-4

# Test
test:
  use_train_loader: true
  image_num_range: [6, 6]
  iters_per_test: 2
  batch_size: 1
  num_workers: 0

# Logging
log:
  ckpt_interval: 100
  max_checkpoints: 100

vis:
  enabled: true
  interval: ${train.iters_per_epoch}
  sample_index: 0
  output_subdir: rerun
  item_name: pi3x_overfit_sample
