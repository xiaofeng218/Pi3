# @package _global_

defaults:
  - pi3x_hand_object
  - _self_

name: pi3x_overfit

# Dataset: overfit on a single fixed track with 3 frames per sample.
train_dataset:
  data_root: ${oc.env:DEXYCB_ROOT,${oc.env:PI3_DATA_ROOT,data}/dataset/dexycb}
  frame_num: 3
  max_tracks: 1
  fix_epoch_seed: true
  resolution:
    - [224, 224]

# Ignored when test.use_train_loader=true; kept mirrored for readability.
test_dataset:
  data_root: ${oc.env:DEXYCB_ROOT,${oc.env:PI3_DATA_ROOT,data}/dataset/dexycb}
  mode: train
  frame_num: 3
  max_tracks: 1
  fix_epoch_seed: true
  resolution:
    - [224, 224]

# Hand encoder paths
hand_encoder:
  config_file: ${oc.env:HAMER_CONFIG_FILE,configs/hamer/model_config.yaml}
  checkpoint: ${oc.env:HAMER_ENCODER_CKPT,null}
  cache_dir: ${oc.env:HAMER_CACHE_DIR,${oc.env:PI3_DATA_ROOT,data}/model/hamer/_DATA}

# Model paths
model:
  ckpt: ${oc.env:PI3X_CKPT,null}
  encoder_pretrained: true
  hamer_config_file: ${oc.env:HAMER_CONFIG_FILE,configs/hamer/model_config.yaml}
  hamer_cache_dir: ${oc.env:HAMER_CACHE_DIR,${oc.env:PI3_DATA_ROOT,data}/model/hamer/_DATA}

# Training parameters for overfitting
train:
  image_num_range: [3, 3]
  max_img_per_gpu: 3
  num_epoch: 10
  iters_per_epoch: 100
  batch_size: 1
  num_workers: 0
  print_freq: 10
  auto_resume: false
  resume: null
  optimizer:
    lr: 5e-4

# Test
test:
  use_train_loader: true
  image_num_range: [3, 3]
  iters_per_test: 1
  batch_size: 1
  num_workers: 0

# Logging
log:
  ckpt_interval: 100
  max_checkpoints: 100

vis:
  enabled: true
  interval: 5
  sample_index: 0
  output_subdir: rerun
  item_name: pi3x_overfit_sample
