# @package _global_

defaults:
  - pi3x_hand_object
  - _self_

name: pi3x_overfit

# Dataset: only 1 track, 12 frames per sample
train_dataset:
  data_root: ${oc.env:DEXYCB_ROOT,data/dataset/dexycb}
  frame_num: 6
  max_tracks: 1
  fix_epoch_seed: true

# Ignored when test.use_train_loader=true; kept mirrored for readability.
test_dataset:
  data_root: ${oc.env:DEXYCB_ROOT,data/dataset/dexycb}
  mode: train
  frame_num: 6
  max_tracks: 1
  fix_epoch_seed: true

# Hand encoder paths
hand_encoder:
  config_file: ${oc.env:HAMER_CONFIG_FILE,configs/hamer/model_config.yaml}
  checkpoint: ${oc.env:HAMER_ENCODER_CKPT,null}
  cache_dir: ${oc.env:HAMER_CACHE_DIR,data/model/hamer/_DATA}

# Model paths
model:
  ckpt: ${oc.env:PI3X_CKPT,null}
  encoder_pretrained: true
  hamer_config_file: ${oc.env:HAMER_CONFIG_FILE,configs/hamer/model_config.yaml}
  hamer_cache_dir: ${oc.env:HAMER_CACHE_DIR,data/model/hamer/_DATA}

# Training parameters for overfitting
train:
  num_epoch: 5
  iters_per_epoch: 100
  batch_size: 1
  num_workers: 0
  print_freq: 10
  dynamic_compile: false
  dynamo_backend: NO
  model_dtype: bf16
  auto_resume: false
  resume: null
  optimizer:
    lr: 5e-4

# Test
test:
  use_train_loader: true
  iters_per_test: 1
  batch_size: 1
  num_workers: 0

# Logging
log:
  ckpt_interval: 100
  max_checkpoints: 5

vis:
  enabled: true
  interval: 100
  sample_index: 0
  output_subdir: rerun
  item_name: pi3x_overfit_sample
